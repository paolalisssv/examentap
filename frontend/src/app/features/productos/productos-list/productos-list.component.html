<section class="page">
  <div class="page-header">
    <h1>Productos</h1>
    <div class="page-actions">
      <button type="button" class="btn-secondary" (click)="exportPdf()">Descargar PDF</button>
      <button type="button" class="btn-secondary" (click)="exportExcel()">Descargar Excel</button>
      @if (authService.tienePermiso('productos', 'crear')) {
        <a routerLink="/productos/nuevo" class="btn-primary">Nuevo Producto</a>
      }
    </div>
  </div>

  @if (successMessage()) {
    <div class="alert-success" role="status">{{ successMessage() }}</div>
  }

  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [total]="total()"
    [page]="page()"
    [pageSize]="pageSize"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    [loading]="loading()"
    [canEdit]="authService.tienePermiso('productos', 'editar')"
    [canDelete]="authService.tienePermiso('productos', 'eliminar')"
    (searchChange)="onSearch($event)"
    (sortChange)="onSort($event)"
    (pageChange)="onPageChange($event)"
    (view)="onView($event)"
    (edit)="onEdit($event)"
    (delete)="onDeleteRequest($event)"
  ></app-data-table>
</section>

<app-confirm-dialog
  [open]="deleteTarget() !== null"
  title="Eliminar producto"
  [message]="
    '¿Deseas eliminar el producto ' +
    (deleteTarget()?.name ?? '') +
    '? Esta acción no se puede deshacer.'
  "
  (confirm)="confirmDelete()"
  (dismiss)="cancelDelete()"
></app-confirm-dialog>

<app-modal [open]="detailOpen()" title="Detalle de producto" (closed)="closeDetail()">
  @if (detail(); as data) {
    <dl>
      <dt>Código</dt>
      <dd>{{ data.id }}</dd>
      <dt>Nombre</dt>
      <dd>{{ data.name }}</dd>
      <dt>Precio</dt>
      <dd>{{ data.precio.toFixed(2) }}</dd>
      <dt>Fecha de creación</dt>
      <dd>{{ formatDate(data.createdAt) }}</dd>
    </dl>
  }
</app-modal>
